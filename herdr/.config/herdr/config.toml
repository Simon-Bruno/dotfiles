onboarding = false

[keys]
# Adapted from dstotijn/dotfiles. Karabiner's Caps Lock layer types the prefix plus these keys.
prefix = "ctrl+space"

settings = "prefix+shift+s"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"

previous_tab = "prefix+shift+h"
next_tab = "prefix+shift+l"
new_tab = ["ctrl+t", "prefix+c"]

cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"

split_vertical = "prefix+v"
split_horizontal = "prefix+s"
zoom = "prefix+z"

close_tab = "prefix+x"
close_pane = "prefix+shift+x"

swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

[ui]
tab_bar_gap = 1  # blank row under the tab bar, so panes start level with the first space (matches header_gap; local herdr patch)
pane_scrollbars = false  # no scrollbar column on the right of each pane
show_agent_labels_on_pane_borders = true
sidebar_width = 34
sidebar_max_width = 48
prompt_new_tab_name = false  # new tabs open straight away with a generated name

# Sidebar spacing and divider. These three settings come from our local herdr patch
# (~/.config/herdr/patches); stock herdr ignores them. Apply changes with: herdr server reload-config
[ui.sidebar]
inset_right = 2      # blank columns between the sidebar content (lines, highlights) and the divider
header_gap = 1       # blank rows between a section header and its first entry
divider = "▏"        # line on the left edge of its column, so lines and highlights meet it exactly

[ui.sidebar.agents]
row_gap = 0
# $kind and $label come from the namer (~/.config/herdr/namer); $label is "new session" until it names the agent.
# State as a word: blocked (red) and done (blue) need Simon, working and idle are dimmed.
rows = [
  ["state_icon", { token = "state_text", rules = [
      { equals = "blocked", fg = "#ff453a", bold = true },
      { equals = "done", fg = "#0a84ff", bold = true },
      { equals = "working", dim = true },
      { equals = "idle", dim = true } ] }, "$kind"],
  ["$label"],
  [{ token = "tab", dim = true }],
]

[theme]
# macOS system colors on top of the terminal theme, which takes its base colors from Ghostty.
# No auto_switch: herdr misdetected light mode inside Ghostty and painted the sidebar white.
name = "terminal"

[theme.custom]
panel_bg = "reset"          # tab bar blends into the window
sidebar_bg = "reset"        # same surface as the content, so the glass shows through
active_row_bg = "#3a3a3c"   # macOS selected row
selection_bg = "#3f638b"    # matches Ghostty's text selection
surface0 = "#2c2c2e"        # inactive tabs
surface_dim = "#38383a"     # dividers, macOS separator
accent = "#aeaeb2"          # active tab: soft light-gray pill, dark label stays readable
text = "#e5e5e7"
subtext0 = "#98989d"        # secondary labels
overlay0 = "#8e8e93"        # section headers
overlay1 = "#98989d"
red = "#ff453a"
green = "#32d74b"
yellow = "#ffd60a"
blue = "#0a84ff"
teal = "#64d2ff"
peach = "#ff9f0a"
mauve = "#bf5af2"
